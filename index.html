<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PW Offroll HRMS Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased h-screen overflow-hidden">

  <div class="flex h-full">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-950 text-slate-200 flex flex-col justify-between p-5 shadow-2xl z-20">
      <div>
        <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
          <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg">
            <i class="fa-solid fa-users-gear text-xl"></i>
          </div>
          <div>
            <h2 class="font-extrabold text-white text-base">PW Offroll HRMS</h2>
            <span class="text-[11px] text-slate-400 font-semibold uppercase">Live CSV & Local Storage</span>
          </div>
        </div>

        <div class="text-[11px] font-bold text-slate-400 uppercase mb-3 px-2">Navigation</div>
        <nav class="space-y-2">
          <button onclick="switchTab('Warehouse')" id="btnWarehouse" class="w-full text-left flex items-center justify-between p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md transition">
            <span class="flex items-center gap-3"><i class="fa-solid fa-warehouse"></i> Warehouse</span>
          </button>
          
          <button onclick="switchTab('PrintingPress')" id="btnPrinting" class="w-full text-left flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white font-bold transition">
            <span class="flex items-center gap-3"><i class="fa-solid fa-print"></i> Printing Press</span>
          </button>
        </nav>
      </div>

      <div class="p-3.5 bg-slate-900 rounded-xl border border-slate-800">
        <div class="flex items-center gap-2 text-xs font-bold text-emerald-400">
          <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-ping"></span>
          Permanent Deletion Sync
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
      <header class="bg-white border-b border-slate-300 px-8 py-4 flex justify-between items-center shadow-sm">
        <div>
          <h1 id="tabTitle" class="text-2xl font-black text-slate-950">Warehouse Onboarding</h1>
          <p class="text-xs font-semibold text-slate-500">Live Data Fetcher with Permanent Delete Memory</p>
        </div>

        <div class="flex items-center gap-3">
          <input type="text" id="searchInput" oninput="applySearchFilter()" placeholder="Search employee..." class="px-4 py-2 bg-slate-100 border rounded-lg text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
          
          <button onclick="openModal(false)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-extrabold flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-user-plus"></i> Add Employee
          </button>

          <button onclick="clearAndRefetch()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm" title="Clear Cache and Refetch Sheet">
            <i class="fa-solid fa-rotate"></i> Reset/Refetch
          </button>
        </div>
      </header>

      <div class="flex-1 p-8 overflow-hidden flex flex-col bg-slate-100">

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-300 flex items-center gap-4">
            <div class="p-3 bg-blue-100 text-blue-700 rounded-xl"><i class="fa-solid fa-users text-2xl"></i></div>
            <div>
              <p class="text-xs font-bold uppercase text-slate-500">Active Records</p>
              <h3 id="statTotal" class="text-2xl font-black text-slate-950">0</h3>
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-300 flex items-center gap-4">
            <div class="p-3 bg-indigo-100 text-indigo-700 rounded-xl"><i class="fa-solid fa-table-list text-2xl"></i></div>
            <div>
              <p class="text-xs font-bold uppercase text-slate-500">Total Fields</p>
              <h3 id="statCols" class="text-2xl font-black text-slate-950">0</h3>
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-300 flex items-center gap-4">
            <div class="p-3 bg-emerald-100 text-emerald-700 rounded-xl"><i class="fa-solid fa-shield-halved text-2xl"></i></div>
            <div>
              <p class="text-xs font-bold uppercase text-slate-500">Duplicate Shield</p>
              <h3 class="text-sm font-black text-emerald-700">Strictly Active</h3>
            </div>
          </div>
        </div>

        <div id="alertBanner" class="hidden mb-4 p-4 rounded-xl border font-bold text-xs flex items-center justify-between">
          <span id="alertMessage"></span>
          <button onclick="document.getElementById('alertBanner').classList.add('hidden')" class="font-bold text-lg">&times;</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-300 flex-1 flex flex-col overflow-hidden">
          <div id="loader" class="flex-1 flex flex-col items-center justify-center p-8">
            <div class="w-10 h-10 border-4 border-blue-600/30 border-t-blue-600 rounded-full animate-spin mb-3"></div>
            <p class="text-xs font-bold text-slate-600">Syncing with Google Sheet...</p>
          </div>

          <div id="tableWrapper" class="flex-1 overflow-auto custom-scrollbar hidden">
            <table class="w-full text-left border-collapse" id="hrmsTable">
              <thead class="bg-slate-200 text-slate-900 uppercase text-[11px] font-extrabold sticky top-0 border-b">
                <tr id="tableHead"></tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-slate-200 text-xs font-bold"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="empModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden border flex flex-col max-h-[90vh]">
      <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center">
        <h3 id="modalTitle" class="font-extrabold text-sm">Add New Employee</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <form id="empForm" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4 custom-scrollbar flex-1">
        <div id="formInputs" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        <div id="modalError" class="hidden p-3 bg-rose-100 text-rose-800 font-bold text-xs rounded-lg"></div>

        <div class="flex justify-end gap-3 pt-4 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-800 font-bold rounded-lg text-xs">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-lg text-xs">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CSV_URLS = {
      Warehouse: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT17aGvO1QO_8z46p4r8P7QxGZg49T23X66sVf/pub?gid=0&single=true&output=csv",
      PrintingPress: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT17aGvO1QO_8z46p4r8P7QxGZg49T23X66sVf/pub?gid=12345678&single=true&output=csv"
    };

    let activeTab = 'Warehouse';
    let globalHeaders = [];
    let globalRows = [];
    let deletedIds = []; 
    let editingRowIdx = -1;

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabTitle').textContent = tab === 'Warehouse' ? "Warehouse Onboarding" : "Printing Press Onboarding";
      document.getElementById('btnWarehouse').className = tab === 'Warehouse' ? "w-full text-left flex items-center justify-between p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md transition" : "w-full text-left flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white font-bold transition";
      document.getElementById('btnPrinting').className = tab === 'PrintingPress' ? "w-full text-left flex items-center justify-between p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md transition" : "w-full text-left flex items-center justify-between p-3 rounded-xl hover:bg-slate-900 text-slate-400 hover:text-white font-bold transition";
      
      initData();
    }

    async function initData() {
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('tableWrapper').classList.add('hidden');

      // Load deleted IDs list
      const savedDeleted = localStorage.getItem(`hrms_deleted_${activeTab}`);
      deletedIds = savedDeleted ? JSON.parse(savedDeleted) : [];

      // Check if local modified data exists
      const localData = localStorage.getItem(`hrms_data_${activeTab}`);
      const localHeaders = localStorage.getItem(`hrms_headers_${activeTab}`);

      if (localData && localHeaders) {
        globalHeaders = JSON.parse(localHeaders);
        globalRows = JSON.parse(localData);
        renderTable();
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('tableWrapper').classList.remove('hidden');
      } else {
        await fetchFromCSV();
      }
    }

    async function fetchFromCSV() {
      try {
        const response = await fetch(CSV_URLS[activeTab] || CSV_URLS.Warehouse);
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        if (parsedData && parsedData.length > 0) {
          globalHeaders = parsedData[0];
          let rawRows = parsedData.slice(1);

          // Find Identification Column (Aadhaar/Emp ID)
          const primaryIdx = getPrimaryColIndex(globalHeaders);

          // Filter out rows that were previously DELETED
          globalRows = rawRows.filter(row => {
            const rowId = (row[primaryIdx] || "").trim().toLowerCase();
            return rowId && !deletedIds.includes(rowId);
          });

          saveToLocalStorage();
          renderTable();
        } else {
          showAlert("CSV Sheet empty mili!", "error");
        }
      } catch (err) {
        showAlert("Google Sheet Sync Failed! Checking local data.", "error");
      } finally {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('tableWrapper').classList.remove('hidden');
      }
    }

    function parseCSV(text) {
      let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      return lines.map(line => {
        let values = [];
        let insideQuote = false;
        let currentVal = '';
        for (let char of line) {
          if (char === '"') { insideQuote = !insideQuote; }
          else if (char === ',' && !insideQuote) {
            values.push(currentVal.trim());
            currentVal = '';
          } else { currentVal += char; }
        }
        values.push(currentVal.trim());
        return values;
      });
    }

    function getPrimaryColIndex(headers) {
      const idx = headers.findIndex(h => {
        const str = h.toLowerCase();
        return str.includes('aadhar') || str.includes('emp') || str.includes('id') || str.includes('code');
      });
      return idx >= 0 ? idx : 0;
    }

    function saveToLocalStorage() {
      localStorage.setItem(`hrms_headers_${activeTab}`, JSON.stringify(globalHeaders));
      localStorage.setItem(`hrms_data_${activeTab}`, JSON.stringify(globalRows));
      localStorage.setItem(`hrms_deleted_${activeTab}`, JSON.stringify(deletedIds));
    }

    function clearAndRefetch() {
      if (confirm("Kyu aap pure Cache ko reset karke Google Sheet se wapas data load karna chahte hain? (Deleted History bhi reset ho jayegi)")) {
        localStorage.removeItem(`hrms_headers_${activeTab}`);
        localStorage.removeItem(`hrms_data_${activeTab}`);
        localStorage.removeItem(`hrms_deleted_${activeTab}`);
        initData();
        showAlert("Reset completed!", "success");
      }
    }

    function renderTable() {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = '';
      body.innerHTML = '';

      document.getElementById('statTotal').textContent = globalRows.length;
      document.getElementById('statCols').textContent = globalHeaders.length;

      globalHeaders.forEach(h => {
        const th = document.createElement('th');
        th.className = "px-4 py-3 whitespace-nowrap";
        th.textContent = h;
        head.appendChild(th);
      });

      const actionTh = document.createElement('th');
      actionTh.className = "px-4 py-3 text-center";
      actionTh.textContent = "ACTIONS";
      head.appendChild(actionTh);

      globalRows.forEach((row, rIdx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-200/60 transition border-b";

        globalHeaders.forEach((_, cIdx) => {
          const td = document.createElement('td');
          td.className = "px-4 py-3 whitespace-nowrap";
          td.textContent = row[cIdx] || '-';
          tr.appendChild(td);
        });

        const actionTd = document.createElement('td');
        actionTd.className = "px-4 py-3 text-center space-x-2";
        actionTd.innerHTML = `
          <button onclick="editRow(${rIdx})" class="p-1.5 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button onclick="deleteRow(${rIdx})" class="p-1.5 bg-rose-100 text-rose-700 rounded-lg hover:bg-rose-200" title="Delete"><i class="fa-solid fa-trash"></i></button>
        `;
        tr.appendChild(actionTd);
        body.appendChild(tr);
      });
    }

    function openModal(isEdit = false) {
      document.getElementById('modalError').classList.add('hidden');
      const container = document.getElementById('formInputs');
      container.innerHTML = '';

      document.getElementById('modalTitle').textContent = isEdit ? "Edit Employee Record" : "Add New Employee";
      const rowData = isEdit ? globalRows[editingRowIdx] : [];

      const primaryIdx = getPrimaryColIndex(globalHeaders);

      globalHeaders.forEach((h, idx) => {
        const div = document.createElement('div');
        const isPrimary = idx === primaryIdx;
        div.innerHTML = `
          <label class="block text-xs font-bold text-slate-700 mb-1">${h} ${isPrimary ? '*' : ''}</label>
          <input type="text" data-idx="${idx}" value="${rowData[idx] || ''}" ${isPrimary ? 'required' : ''} 
            class="w-full px-3 py-2 border rounded-lg text-xs font-bold focus:ring-2 focus:ring-blue-500">
        `;
        container.appendChild(div);
      });

      document.getElementById('empModal').classList.remove('hidden');
      document.getElementById('empModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('empModal').classList.add('hidden');
      document.getElementById('empModal').classList.remove('flex');
      editingRowIdx = -1;
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const inputs = document.querySelectorAll('#formInputs input');
      let newRow = new Array(globalHeaders.length).fill('');
      const primaryIdx = getPrimaryColIndex(globalHeaders);

      inputs.forEach(input => {
        const idx = parseInt(input.getAttribute('data-idx'));
        newRow[idx] = input.value.trim();
      });

      const newId = (newRow[primaryIdx] || "").trim().toLowerCase();

      // DUPLICATE CHECKING
      if (newId) {
        for (let i = 0; i < globalRows.length; i++) {
          if (i === editingRowIdx) continue;
          const existingId = (globalRows[i][primaryIdx] || "").trim().toLowerCase();
          
          if (existingId && existingId === newId) {
            document.getElementById('modalError').textContent = "STRICT BLOCK: Candidate with this Identification ID is ALREADY REGISTERED!";
            document.getElementById('modalError').classList.remove('hidden');
            return;
          }
        }
      }

      if (editingRowIdx >= 0) {
        globalRows[editingRowIdx] = newRow;
        showAlert("Employee record updated successfully!", "success");
      } else {
        globalRows.push(newRow);
        showAlert("New employee added successfully!", "success");
      }

      saveToLocalStorage();
      renderTable();
      closeModal();
    }

    function editRow(idx) {
      editingRowIdx = idx;
      openModal(true);
    }

    function deleteRow(idx) {
      if (confirm("Are you sure you want to delete this candidate?")) {
        const primaryIdx = getPrimaryColIndex(globalHeaders);
        const targetId = (globalRows[idx][primaryIdx] || "").trim().toLowerCase();

        if (targetId) {
          deletedIds.push(targetId); // Blacklist the deleted candidate ID permanently
        }

        globalRows.splice(idx, 1);
        saveToLocalStorage();
        renderTable();
        showAlert("Employee record deleted permanently!", "success");
      }
    }

    function applySearchFilter() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      rows.forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    function showAlert(msg, type) {
      const banner = document.getElementById('alertBanner');
      banner.className = `mb-4 p-4 rounded-xl border font-bold text-xs flex justify-between ${type === 'error' ? 'bg-rose-100 text-rose-900 border-rose-300' : 'bg-emerald-100 text-emerald-900 border-emerald-300'}`;
      document.getElementById('alertMessage').textContent = msg;
      banner.classList.remove('hidden');
    }

    // Initialize
    initData();
  </script>
</body>
</html>
