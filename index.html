<script>
// ============================================================
// GOOGLE SHEET SOURCES
// ============================================================

// EXISTING HRMS ATTENDANCE SHEET
const GOOGLE_SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRFoCW6qj1J85c8Z1sOSJqvexKtECuM1UMEANVIFQ1yVJRvGixR5VNh4VT66O23pi7p8y2sLc543337/pub?gid=1333099798&single=true&output=csv";


// NEW DS PRINTING PRESS ATTENDANCE SHEET
const PRINTING_PRESS_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQYBjt11wkD13f_LHrdq_hzTV53_pObPlxxvQKTaOmxthhkk_ARzRec3asnmc1A_Bfh7-Ok74Cb2Mfh/pub?gid=1787118786&single=true&output=csv";


// ============================================================
// BOTH SHEETS
// ============================================================

const SHEET_SOURCES = [
  {
    name: "Main Attendance",
    url: GOOGLE_SHEET_CSV_URL
  },
  {
    name: "DS Printing Press",
    url: PRINTING_PRESS_CSV_URL
  }
];


// ============================================================
// GLOBAL VARIABLES
// ============================================================

let parsedData = [];
let sourceDatasets = [];

let currentMatchedRow = null;
let currentHeaderRow = null;

let dateColumnsInfo = [];

const monthNames = [
  "Jan", "Feb", "Mar", "Apr", "May", "Jun",
  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
];


// ============================================================
// STRING CLEANER
// ============================================================

function cleanString(str) {

  return String(str || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


// ============================================================
// GET CELL VALUE
// ============================================================

function getCell(row, index) {

  if (
    index >= 0 &&
    row &&
    row[index] !== undefined &&
    row[index] !== null
  ) {

    return String(row[index]).trim();

  }

  return "";

}


// ============================================================
// FIND HEADER ROW
// ============================================================

function findHeaderRow(data) {

  for (let i = 0; i < data.length; i++) {

    const row = data[i] || [];

    const cells = row.map(cleanString);

    const hasEmpId = cells.some(v =>
      v === "emp id" ||
      v === "empid" ||
      v.includes("employee id")
    );

    const hasName = cells.some(v =>
      v === "name" ||
      v === "employee name"
    );

    if (hasEmpId && hasName) {

      return i;

    }

  }

  return -1;

}


// ============================================================
// FIND COLUMN
// ============================================================

function findColumn(header, names) {

  const wanted = names.map(cleanString);

  for (let i = 0; i < header.length; i++) {

    const h = cleanString(header[i]);

    if (wanted.includes(h)) {

      return i;

    }

  }

  return -1;

}


// ============================================================
// DATE PARSER
// ============================================================

function parseSheetDate(dateStr) {

  if (!dateStr) return null;

  let str = String(dateStr)
    .trim()
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ");

  const monthMap = {

    jan: 0,
    january: 0,

    feb: 1,
    february: 1,

    mar: 2,
    march: 2,

    apr: 3,
    april: 3,

    may: 4,

    jun: 5,
    june: 5,

    jul: 6,
    july: 6,

    aug: 7,
    august: 7,

    sep: 8,
    sept: 8,
    september: 8,

    oct: 9,
    october: 9,

    nov: 10,
    november: 10,

    dec: 11,
    december: 11

  };


  // ----------------------------------------------------------
  // FORMAT: 1-Sep / 04-Sept / 1-September
  // ----------------------------------------------------------

  let m = str.match(
    /^(\d{1,2})\s*[-\/]\s*([A-Za-z]{3,9})(?:\s*[-\/]\s*(20\d{2}))?$/
  );

  if (m) {

    const day = parseInt(m[1], 10);

    const month = monthMap[m[2].toLowerCase()];

    const year = m[3]
      ? parseInt(m[3], 10)
      : new Date().getFullYear();

    if (
      month !== undefined &&
      day >= 1 &&
      day <= 31
    ) {

      return new Date(
        year,
        month,
        day,
        12,
        0,
        0
      );

    }

  }


  // ----------------------------------------------------------
  // FORMAT: Sep-1 / Sep 1
  // ----------------------------------------------------------

  m = str.match(
    /^([A-Za-z]{3,9})\s*[-\/]?\s*(\d{1,2})(?:\s*[-\/]\s*(20\d{2}))?$/
  );

  if (m) {

    const month = monthMap[m[1].toLowerCase()];

    const day = parseInt(m[2], 10);

    const year = m[3]
      ? parseInt(m[3], 10)
      : new Date().getFullYear();

    if (
      month !== undefined &&
      day >= 1 &&
      day <= 31
    ) {

      return new Date(
        year,
        month,
        day,
        12,
        0,
        0
      );

    }

  }


  // ----------------------------------------------------------
  // NORMAL DATE FORMAT
  // ----------------------------------------------------------

  const nativeDate = new Date(str);

  if (!isNaN(nativeDate.getTime())) {

    return new Date(
      nativeDate.getFullYear(),
      nativeDate.getMonth(),
      nativeDate.getDate(),
      12,
      0,
      0
    );

  }

  return null;

}


// ============================================================
// FORMAT DATE
// ============================================================

function formatCleanDateStr(dateObj) {

  if (!dateObj) return "";

  return (
    dateObj.getDate() +
    "-" +
    monthNames[dateObj.getMonth()]
  );

}


// ============================================================
// ANALYSE EACH GOOGLE SHEET
// ============================================================

function analyseSheet(data) {

  const headerIndex = findHeaderRow(data);

  if (headerIndex < 0) {

    return null;

  }

  const header = data[headerIndex] || [];


  const empIdIndex = findColumn(
    header,
    [
      "Emp ID",
      "EmpID",
      "Employee ID"
    ]
  );


  const nameIndex = findColumn(
    header,
    [
      "Name",
      "Employee Name"
    ]
  );


  const fatherIndex = findColumn(
    header,
    [
      "Father Name",
      "FatherName"
    ]
  );


  const deptIndex = findColumn(
    header,
    [
      "Dept",
      "Department"
    ]
  );


  const desigIndex = findColumn(
    header,
    [
      "Designation",
      "Desig"
    ]
  );


  const dojIndex = findColumn(
    header,
    [
      "DOJ",
      "Date of Joining",
      "Joining Date"
    ]
  );


  const statusIndex = findColumn(
    header,
    [
      "Status"
    ]
  );


  const vendorIndex = findColumn(
    header,
    [
      "Vendor",
      "Vendor Name"
    ]
  );


  // Attendance starts after Status
  // New Printing Press Sheet:
  // C = Emp ID
  // D = Name
  // E = Father Name
  // F = Designation
  // G = DOJ
  // H = Status
  // I onwards = Attendance

  const attendanceStart =
    statusIndex >= 0
      ? statusIndex + 1
      : Math.max(
          empIdIndex,
          nameIndex
        ) + 1;


  const dateColumns = [];


  for (
    let col = attendanceStart;
    col < header.length;
    col++
  ) {

    const dateStr =
      String(header[col] || "").trim();

    if (!dateStr) continue;


    const lower =
      dateStr.toLowerCase();


    if (
      lower.includes("present") ||
      lower.includes("total") ||
      lower.includes("night")
    ) {

      continue;

    }


    const parsedDate =
      parseSheetDate(dateStr);


    if (parsedDate) {

      dateColumns.push({

        colIndex: col,

        dateObj: parsedDate,

        cleanDateStr:
          formatCleanDateStr(parsedDate)

      });

    }

  }


  return {

    headerIndex,

    header,

    empIdIndex,

    nameIndex,

    fatherIndex,

    deptIndex,

    desigIndex,

    dojIndex,

    statusIndex,

    vendorIndex,

    dateColumns

  };

}


// ============================================================
// BUILD EMPLOYEE RECORD
// ============================================================

function buildEmployeeRecord(
  row,
  meta,
  sourceName
) {

  return {

    row: row,

    meta: meta,

    sourceName: sourceName,

    empId:
      getCell(
        row,
        meta.empIdIndex
      ),

    name:
      getCell(
        row,
        meta.nameIndex
      ),

    fatherName:
      getCell(
        row,
        meta.fatherIndex
      ),

    dept:
      getCell(
        row,
        meta.deptIndex
      ),

    desig:
      getCell(
        row,
        meta.desigIndex
      ),

    doj:
      getCell(
        row,
        meta.dojIndex
      ),

    status:
      getCell(
        row,
        meta.statusIndex
      ),

    vendor:
      getCell(
        row,
        meta.vendorIndex
      )

  };

}


// ============================================================
// FETCH ONE CSV
// ============================================================

function fetchCsv(url) {

  return new Promise(
    (resolve, reject) => {

      const cacheBuster =
        (url.includes("?") ? "&" : "?") +
        "t=" +
        new Date().getTime();


      Papa.parse(
        url + cacheBuster,
        {

          download: true,

          skipEmptyLines: false,

          complete: function(results) {

            resolve(
              results.data || []
            );

          },

          error: function(error) {

            reject(error);

          }

        }

      );

    }
  );

}


// ============================================================
// FETCH BOTH GOOGLE SHEETS
// ============================================================

async function fetchSheetData() {

  const syncText =
    document.getElementById(
      "syncText"
    );


  syncText.textContent =
    "🔄 Fetching latest data from Google Sheets...";


  try {

    const results =
      await Promise.all(

        SHEET_SOURCES.map(
          source =>
            fetchCsv(source.url)
        )

      );


    sourceDatasets =
      results.map(
        (data, index) => ({

          name:
            SHEET_SOURCES[index].name,

          data: data,

          meta:
            analyseSheet(data)

        })
      );


    // Existing system compatibility
    parsedData =
      sourceDatasets[0]
        ? sourceDatasets[0].data
        : [];


    const loadedSheets =
      sourceDatasets
        .filter(
          sheet =>
            sheet.data &&
            sheet.data.length > 0
        )
        .map(
          sheet =>
            sheet.name
        );


    if (loadedSheets.length > 0) {

      syncText.innerHTML =
        "🟢 <b>Live Connected:</b> " +
        loadedSheets.join(" + ") +
        " synced!";

    } else {

      syncText.textContent =
        "❌ Google Sheet data nahi mila.";

    }


  } catch (error) {

    console.error(
      "Google Sheet Error:",
      error
    );


    syncText.textContent =
      "❌ Sheet load nahi ho payi. Refresh Data par click karein.";

  }

}


// ============================================================
// PAGE LOAD
// ============================================================

window.onload =
  fetchSheetData;


// ============================================================
// FIND EMPLOYEE IN BOTH SHEETS
// ============================================================

function findEmployeeRecords(
  inputEmpId,
  inputEmpName
) {

  const matches = [];


  sourceDatasets.forEach(
    dataset => {

      if (!dataset.meta) return;


      const meta =
        dataset.meta;


      for (
        let i =
          meta.headerIndex + 1;

        i <
        dataset.data.length;

        i++
      ) {

        const row =
          dataset.data[i];


        if (
          !row ||
          row.length === 0
        ) {

          continue;

        }


        const empId =
          cleanString(
            getCell(
              row,
              meta.empIdIndex
            )
          );


        const name =
          cleanString(
            getCell(
              row,
              meta.nameIndex
            )
          );


        if (
          empId === inputEmpId &&
          name === inputEmpName
        ) {

          matches.push(
            buildEmployeeRecord(
              row,
              meta,
              dataset.name
            )
          );

        }

      }

    }
  );


  return matches;

}


// ============================================================
// LOGIN
// ============================================================

function verifyUserAndLogin() {

  const inputEmpId =
    cleanString(
      document.getElementById(
        "loginEmpId"
      ).value
    );


  const inputEmpName =
    cleanString(
      document.getElementById(
        "loginEmpName"
      ).value
    );


  if (
    !inputEmpId ||
    !inputEmpName
  ) {

    alert(
      "Kripya Emp ID aur Employee Name dono enter karein!"
    );

    return;

  }


  if (
    sourceDatasets.length === 0 ||
    sourceDatasets.every(
      x =>
        !x.data ||
        x.data.length === 0
    )
  ) {

    alert(
      "Data load ho raha hai. Kripya Refresh Data par click karke try karein."
    );

    return;

  }


  // SEARCH IN BOTH SHEETS
  const matchedRecords =
    findEmployeeRecords(
      inputEmpId,
      inputEmpName
    );


  if (
    matchedRecords.length === 0
  ) {

    alert(
      "Invalid Credentials! User ID (Emp ID) ya Password (Name) sahi nahi hai."
    );

    return;

  }


  // ==========================================================
  // EMPLOYEE PROFILE
  // ==========================================================

  const profile = {

    empId: "",

    name: "",

    fatherName: "",

    dept: "",

    desig: "",

    doj: "",

    status: "",

    vendor: ""

  };


  // If employee exists in both sheets,
  // first available value will be used.

  matchedRecords.forEach(
    record => {

      const fields = [
        "empId",
        "name",
        "fatherName",
        "dept",
        "desig",
        "doj",
        "status",
        "vendor"
      ];


      fields.forEach(
        field => {

          if (
            !profile[field] &&
            record[field]
          ) {

            profile[field] =
              record[field];

          }

        }
      );

    }
  );


  // ==========================================================
  // SHOW EMPLOYEE INFORMATION
  // ==========================================================

  document.getElementById(
    "dispEmpId"
  ).textContent =
    profile.empId || "-";


  document.getElementById(
    "dispEmpName"
  ).textContent =
    profile.name || "-";


  document.getElementById(
    "dispFatherName"
  ).textContent =
    profile.fatherName || "-";


  document.getElementById(
    "dispDept"
  ).textContent =
    profile.dept || "-";


  document.getElementById(
    "dispDesig"
  ).textContent =
    profile.desig || "-";


  document.getElementById(
    "dispDoj"
  ).textContent =
    profile.doj || "-";


  document.getElementById(
    "dispStatus"
  ).textContent =
    profile.status || "-";


  document.getElementById(
    "dispVendor"
  ).textContent =
    profile.vendor || "-";


  // ==========================================================
  // COMBINE ATTENDANCE FROM BOTH SHEETS
  // ==========================================================

  dateColumnsInfo = [];


  matchedRecords.forEach(
    record => {

      record.meta.dateColumns.forEach(
        item => {

          dateColumnsInfo.push({

            sourceName:
              record.sourceName,

            row:
              record.row,

            colIndex:
              item.colIndex,

            dateObj:
              item.dateObj,

            cleanDateStr:
              item.cleanDateStr

          });

        }
      );

    }
  );


  // Sort attendance by date
  dateColumnsInfo.sort(
    (a, b) =>
      a.dateObj - b.dateObj
  );


  // Build month cycle
  buildMonthCycleDropdown();


  // Show dashboard
  document.getElementById(
    "offrollViewLogin"
  ).style.display =
    "none";


  document.getElementById(
    "offrollViewPrivate"
  ).classList.add(
    "show"
  );

}


// ============================================================
// MONTH CYCLE DROPDOWN
// ============================================================

function buildMonthCycleDropdown() {

  const selectEl =
    document.getElementById(
      "monthCycleSelect"
    );


  selectEl.innerHTML = "";


  if (
    dateColumnsInfo.length === 0
  ) {

    return;

  }


  const cyclesMap = {};


  dateColumnsInfo.forEach(
    item => {

      const d =
        item.dateObj;


      const day =
        d.getDate();


      const month =
        d.getMonth();


      const year =
        d.getFullYear();


      let cycleMonth;

      let cycleYear;


      if (day >= 26) {

        cycleMonth =
          (month + 1) % 12;


        cycleYear =
          month === 11
            ? year + 1
            : year;

      } else {

        cycleMonth =
          month;


        cycleYear =
          year;

      }


      const cycleKey =
        `${cycleYear}-${cycleMonth}`;


      if (
        !cyclesMap[cycleKey]
      ) {

        const previousMonth =
          cycleMonth === 0
            ? 11
            : cycleMonth - 1;


        const label =
          `26 ${monthNames[previousMonth]} - 25 ${monthNames[cycleMonth]}`;


        cyclesMap[cycleKey] = {

          key:
            cycleKey,

          label:
            label,

          targetMonth:
            cycleMonth,

          targetYear:
            cycleYear

        };

      }

    }
  );


  const keys =
    Object.keys(
      cyclesMap
    ).sort(
      (a, b) => {

        const [
          ay,
          am
        ] =
          a
            .split("-")
            .map(Number);


        const [
          by,
          bm
        ] =
          b
            .split("-")
            .map(Number);


        return (
          new Date(
            ay,
            am,
            1
          ) -
          new Date(
            by,
            bm,
            1
          )
        );

      }
    );


  keys.forEach(
    key => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        cyclesMap[key].key;


      option.textContent =
        cyclesMap[key].label;


      selectEl.appendChild(
        option
      );

    }
  );


  if (
    keys.length > 0
  ) {

    selectEl.value =
      keys[keys.length - 1];

  }


  renderSelectedMonthAttendance();

}


// ============================================================
// RENDER ATTENDANCE
// ============================================================

function renderSelectedMonthAttendance() {

  const selectedKey =
    document.getElementById(
      "monthCycleSelect"
    ).value;


  if (
    !selectedKey ||
    !currentMatchedRow
  ) {

    return;

  }


  const [
    targetYear,
    targetMonth
  ] =
    selectedKey
      .split("-")
      .map(Number);


  let tbodyHtml = "";


  let totalDays = 0;

  let pCount = 0;

  let nCount = 0;

  let lCount = 0;

  let hdCount = 0;

  let aCount = 0;


  const renderedDates =
    new Set();


  const today =
    new Date();


  today.setHours(
    23,
    59,
    59,
    999
  );


  dateColumnsInfo.forEach(
    item => {

      const d =
        item.dateObj;


      const day =
        d.getDate();


      const month =
        d.getMonth();


      const year =
        d.getFullYear();


      let itemCycleMonth;

      let itemCycleYear;


      if (day >= 26) {

        itemCycleMonth =
          (month + 1) % 12;


        itemCycleYear =
          month === 11
            ? year + 1
            : year;

      } else {

        itemCycleMonth =
          month;


        itemCycleYear =
          year;

      }


      if (
        itemCycleMonth !==
          targetMonth ||
        itemCycleYear !==
          targetYear ||
        d > today
      ) {

        return;

      }


      const dateKey =
        `${year}-${month}-${day}`;


      let statusVal =
        getCell(
          item.row,
          item.colIndex
        );


      // ======================================================
      // DUPLICATE DATE HANDLING
      // ======================================================

      if (
        renderedDates.has(dateKey)
      ) {

        return;

      }


      if (!statusVal) {

        statusVal = "A";

      }


      const upperStatus =
        statusVal
          .toUpperCase()
          .trim();


      totalDays++;


      if (
        upperStatus === "P"
      ) {

        pCount++;

      }

      else if (
        upperStatus === "N"
      ) {

        nCount++;

      }

      else if (
        upperStatus === "L"
      ) {

        lCount++;

      }

      else if (
        upperStatus === "HD"
      ) {

        hdCount++;

      }

      else if (
        upperStatus === "A"
      ) {

        aCount++;

      }


      // ======================================================
      // STATUS CLASS
      // ======================================================

      let statusClass = "";


      if (
        upperStatus === "P"
      ) {

        statusClass =
          "status-P";

      }

      else if (
        upperStatus === "N"
      ) {

        statusClass =
          "status-N";

      }

      else if (
        upperStatus === "L"
      ) {

        statusClass =
          "status-L";

      }

      else if (
        upperStatus === "HD"
      ) {

        statusClass =
          "status-HD";

      }

      else if (
        upperStatus === "WO"
      ) {

        statusClass =
          "status-WO";

      }

      else if (
        upperStatus === "A"
      ) {

        statusClass =
          "status-A";

      }


      tbodyHtml += `

        <tr data-date-key="${dateKey}">

          <td>
            <b>
              ${item.cleanDateStr}
            </b>
          </td>

          <td class="${statusClass}">
            ${escapeHtml(statusVal)}
          </td>

        </tr>

      `;


      renderedDates.add(
        dateKey
      );

    }
  );


  // ==========================================================
  // UPDATE TABLE
  // ==========================================================

  document.getElementById(
    "attendanceTbody"
  ).innerHTML =
    tbodyHtml;


  // ==========================================================
  // UPDATE KPI
  // ==========================================================

  document.getElementById(
    "kpiTotal"
  ).textContent =
    totalDays;


  document.getElementById(
    "kpiPresent"
  ).textContent =
    pCount;


  document.getElementById(
    "kpiNight"
  ).textContent =
    nCount;


  document.getElementById(
    "kpiLeave"
  ).textContent =
    lCount;


  document.getElementById(
    "kpiHalfDay"
  ).textContent =
    hdCount;


  document.getElementById(
    "kpiAbsent"
  ).textContent =
    aCount;

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================================
// LOGOUT
// ============================================================

function offrollViewLogout() {

  document.getElementById(
    "offrollViewLogin"
  ).style.display =
    "block";


  document.getElementById(
    "offrollViewPrivate"
  ).classList.remove(
    "show"
  );


  document.getElementById(
    "loginEmpId"
  ).value =
    "";


  document.getElementById(
    "loginEmpName"
  ).value =
    "";


  currentMatchedRow =
    null;


  currentHeaderRow =
    null;


  dateColumnsInfo =
    [];

}
</script>
