<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboard New Employee</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background-color: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 850px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eaeaea;
    }

    .form-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .sub-label {
      color: #dc2626;
      font-weight: 500;
      font-size: 12px;
    }

    .required-star {
      color: #dc2626;
      font-weight: bold;
      margin-left: 2px;
    }

    .form-group input {
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      color: #1f2937;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .error-text {
      color: #dc2626;
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
      font-weight: 500;
    }

    .input-error {
      border-color: #dc2626 !important;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    .btn-cancel {
      background-color: #e5e7eb;
      color: #374151;
    }

    .btn-cancel:hover {
      background-color: #d1d5db;
    }

    .btn-submit {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #047857;
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h2>Onboard New Employee</h2>
  </div>

  <form id="onboardForm" novalidate>
    <div class="form-grid">

      <!-- Agency Name -->
      <div class="form-group">
        <label for="agencyName">Agency Name</label>
        <input type="text" id="agencyName" placeholder="Enter Agency Name">
      </div>

      <!-- Emp ID -->
      <div class="form-group">
        <label for="empId">Emp ID <span class="sub-label">(11 Chars Alphanumeric)</span></label>
        <input type="text" id="empId" placeholder="e.g. EMP12345678 (Exact 11 Chars)">
      </div>

      <!-- Candidate Name (Fixed: Normal Text Input) -->
      <div class="form-group">
        <label for="candidateName">Candidate Name</label>
        <input type="text" id="candidateName" placeholder="Enter Candidate Name">
      </div>

      <!-- Candidate Father Name (Fixed: Normal Text Input) -->
      <div class="form-group">
        <label for="fatherName">Candidate Father Name</label>
        <input type="text" id="fatherName" placeholder="Enter Father Name">
      </div>

      <!-- Designation -->
      <div class="form-group">
        <label for="designation">Designation</label>
        <input type="text" id="designation" placeholder="Enter Designation">
      </div>

      <!-- Cdt.Aadhar Number (Only field with * and Tree-based Duplicate Checking) -->
      <div class="form-group">
        <label for="aadharNumber">
          Cdt.Aadhar Number <span class="required-star">*</span> 
          <span class="sub-label">(12 Digits Numeric)</span>
        </label>
        <input type="text" id="aadharNumber" maxlength="12" placeholder="12 Digit Aadhaar Number">
        <span id="aadharError" class="error-text"></span>
      </div>

      <!-- Cdt. Mobile Number -->
      <div class="form-group">
        <label for="mobileNumber">Cdt. Mobile Number <span class="sub-label">(10 Digits Numeric)</span></label>
        <input type="text" id="mobileNumber" maxlength="10" placeholder="10 Digit Mobile Number">
      </div>

      <!-- DOB -->
      <div class="form-group">
        <label for="dob">DOB <span class="sub-label">(DD-MMM-YY)</span></label>
        <input type="text" id="dob" placeholder="e.g. 21-Feb-06">
      </div>

      <!-- Interview Date -->
      <div class="form-group">
        <label for="interviewDate">Interview Date <span class="sub-label">(DD-MMM-YY)</span></label>
        <input type="text" id="interviewDate" placeholder="e.g. 21-Feb-06">
      </div>

      <!-- Interview By -->
      <div class="form-group">
        <label for="interviewBy">Interview By</label>
        <input type="text" id="interviewBy" placeholder="Enter Interview By">
      </div>

      <!-- DOJ -->
      <div class="form-group">
        <label for="doj">DOJ <span class="sub-label">(DD-MMM-YY)</span></label>
        <input type="text" id="doj" placeholder="e.g. 21-Feb-06">
      </div>

      <!-- Department -->
      <div class="form-group">
        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Enter Department">
      </div>

    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-cancel">Cancel</button>
      <button type="submit" class="btn btn-submit">Onboard Employee</button>
    </div>
  </form>
</div>

<script>
  // --- BINARY SEARCH TREE (BST) FOR DUPLICATE DETECTION ---
  class TreeNode {
    constructor(val) {
      this.val = val;
      this.left = null;
      this.right = null;
    }
  }

  class AadhaarBST {
    constructor() {
      this.root = null;
    }

    insert(val) {
      if (!this.root) {
        this.root = new TreeNode(val);
        return true;
      }
      let current = this.root;
      while (true) {
        if (val === current.val) return false; // Duplicate found
        if (val < current.val) {
          if (!current.left) {
            current.left = new TreeNode(val);
            return true;
          }
          current = current.left;
        } else {
          if (!current.right) {
            current.right = new TreeNode(val);
            return true;
          }
          current = current.right;
        }
      }
    }

    contains(val) {
      let current = this.root;
      while (current) {
        if (val === current.val) return true;
        current = val < current.val ? current.left : current.right;
      }
      return false;
    }
  }

  // Initialize Binary Search Tree instance
  const aadhaarTree = new AadhaarBST();

  // Test ke liye sample data insert kar rahe hain
  aadhaarTree.insert("123456789012");
  aadhaarTree.insert("987654321098");

  document.addEventListener("DOMContentLoaded", () => {
    const aadharInput = document.getElementById("aadharNumber");
    const aadharError = document.getElementById("aadharError");
    const onboardForm = document.getElementById("onboardForm");

    // Real-time input handling
    aadharInput.addEventListener("input", (e) => {
      // Sirf numbers pass hone de
      let val = e.target.value.replace(/\D/g, "");
      e.target.value = val;

      if (val.length === 12) {
        if (aadhaarTree.contains(val)) {
          aadharError.textContent = "Error: Duplicate Aadhaar Number detected!";
          aadharInput.classList.add("input-error");
        } else {
          aadharError.textContent = "";
          aadharInput.classList.remove("input-error");
        }
      } else {
        aadharError.textContent = "";
        aadharInput.classList.remove("input-error");
      }
    });

    // Form submission event
    onboardForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = aadharInput.value.trim();

      if (!val) {
        aadharError.textContent = "Aadhaar Number is required!";
        aadharInput.classList.add("input-error");
        return;
      }

      if (val.length !== 12) {
        aadharError.textContent = "Aadhaar Number must be exactly 12 digits!";
        aadharInput.classList.add("input-error");
        return;
      }

      if (aadhaarTree.contains(val)) {
        aadharError.textContent = "Error: Duplicate Aadhaar Number detected!";
        aadharInput.classList.add("input-error");
        return;
      }

      // Safe insertion into Tree
      aadhaarTree.insert(val);
      alert("Employee Onboarded Successfully!");

      onboardForm.reset();
      aadharError.textContent = "";
      aadharInput.classList.remove("input-error");
    });
  });
</script>

</body>
</html>
